# Perfil de teste: banco H2 em memória no modo MySQL, para a suíte rodar sem um MySQL local.
spring:
  datasource:
    url: jdbc:h2:mem:petvet;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-access-token-secret-with-at-least-32-bytes
    refresh-secret: test-refresh-token-secret-with-at-least-32-bytes
    expiration-ms: 60000
  cors:
    allowed-origins: http://localhost:5173
