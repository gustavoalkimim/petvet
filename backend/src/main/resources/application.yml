spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/petvet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:petvet_user}
    password: ${DB_PASSWORD:petvet_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Sem valor padrão de propósito: a aplicação não sobe sem estas variáveis (mínimo de 32 bytes cada).
    secret: ${JWT_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.hibernate.SQL: ${LOG_SQL:INFO}
    org.springframework.security: INFO
